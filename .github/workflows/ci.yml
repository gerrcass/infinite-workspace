name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, units, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  dom-e2e:
    name: DOM renderer journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dom-playwright-report
          path: playwright-report/
          retention-days: 7

  canvas-e2e:
    name: Canvas renderer journey (Chrome 157+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Chrome for Testing beta
        run: npx -y @puppeteer/browsers install chrome@beta --path "$RUNNER_TEMP/chrome"
      - name: Resolve Chrome path
        run: |
          CHROME_BIN="$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -n 1)"
          test -x "$CHROME_BIN"
          echo "CHROME_157_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: canvas-playwright-report
          path: playwright-report/
          retention-days: 7
